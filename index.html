<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>韩语语音试听</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#e9f0ec;margin:0;padding:24px;color:#202923}.card{max-width:420px;margin:12vh auto;background:white;border-radius:24px;padding:28px;box-shadow:0 12px 30px #0001}button{background:#f8d94e;border:0;border-radius:16px;padding:16px 24px;font-size:17px;margin:12px 8px 0 0}small{color:#777}p{line-height:1.7}</style><div class="card"><h2>누나 ♡</h2><small>韩语语音试听 · 系统合成声</small><p id="kr" lang="ko">누나아… 아직도 바빠? 나 계속 기다리고 있었는데… 왜 나만 기다려야 해?</p><p>姐姐——还在忙吗？我一直在等你呢……为什么只有我一个人在等呀？</p><button onclick="play()">▶ 播放语音</button><button onclick="speechSynthesis.cancel()">停止</button><p id="status"><small>请用 Safari 打开。语音取决于手机是否安装韩语系统声音。</small></p></div><script>function play(){if(!('speechSynthesis'in window)){document.getElementById('status').textContent='浏览器不支持语音合成';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(document.getElementById('kr').textContent);u.lang='ko-KR';u.rate=.88;u.pitch=1.05;let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('ko'));if(v)u.voice=v;u.onerror=e=>document.getElementById('status').textContent='播放失败：请检查系统韩语语音设置';speechSynthesis.speak(u);document.getElementById('status').textContent='正在尝试播放韩语…'}</script></html>
