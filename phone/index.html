<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171b20">
  <title>捡到郑成灿手机</title>
  <meta name="description" content="一部亮着的手机，一条没来得及回的消息。第一人称互动手书。">
  <link rel="stylesheet" href="film.css">
  <script defer src="film.js"></script>
</head>
<body>
  <main class="film" id="film" data-scene="opening" aria-label="捡到郑成灿手机">
    <div class="street" aria-hidden="true"><div class="pavement"></div></div>
    <div class="title">
      <span lang="ko">밤에 주운 휴대폰</span>
      <h1>捡到郑成灿手机</h1>
    </div>
    <div class="prop">
      <svg class="hand" viewBox="0 0 200 310" aria-hidden="true">
        <path fill="#ad8273" stroke="#574744" stroke-width="2" d="M194 304 139 304 99 251Q76 223 69 195L49 161Q44 149 52 145Q60 141 68 151L86 171 78 139Q73 122 82 119Q92 114 99 131L110 154 105 121Q102 106 112 104Q121 103 125 118L134 148 136 125Q136 112 145 112Q154 113 154 125L155 163Q169 188 168 211L169 230Z"/>
        <path fill="#4e565a" stroke="#373e42" stroke-width="2" d="M109 251 168 224Q175 225 179 236L200 283V310H147Z"/>
        <path fill="none" stroke="#777b7a" stroke-width="2" d="m117 259 59-26m-52 33 55-24m-30 62 30-11"/>
      </svg>
      <div class="phone">
        <div class="lcd" lang="ko">
          <div class="status"><span>21:47</span><span class="island"></span><span class="signals" aria-label="5G, 배터리 78%"><i class="bars"></i> 5G <i class="battery"></i></span></div>
          <header class="chat-head">
            <span class="back-icon" aria-hidden="true"></span><strong>X</strong>
            <button id="search-toggle" class="icon-button" aria-label="대화 검색" aria-expanded="false" disabled><i class="search-icon"></i></button>
          </header>
          <form id="search" class="search" hidden>
            <input id="query" type="search" aria-label="대화 검색" placeholder="대화 내용 검색">
            <button type="submit">찾기</button>
            <output id="search-result" aria-live="polite"></output>
          </form>
          <div id="messages" class="messages" role="region" aria-label="X와의 대화" tabindex="-1"></div>
          <div class="composer"><span aria-hidden="true">＋</span><span>메시지 입력</span><span aria-hidden="true">☺</span></div>
          <div class="home-line"></div>
        </div>
      </div>
      <svg class="thumb" viewBox="0 0 64 110" aria-hidden="true">
        <path fill="#c39a87" stroke="#67504a" stroke-width="1.5" d="M62 107Q53 97 47 79Q42 64 29 55Q17 47 13 35L7 15Q4 5 12 3Q21 1 26 11L37 29Q44 39 54 43Q63 48 64 67Z"/>
        <path fill="#d1a995" d="M10 8Q15 4 19 10L24 20Q19 25 14 21Z"/>
        <path fill="none" stroke="#a77d70" d="M20 29q7-4 12-1m-9 5q6-3 10-2"/>
      </svg>
    </div>
    <div class="opening-copy">
      <p>路边，一部手机还亮着。</p>
      <button class="action" id="pickup">捡起手机 <span aria-hidden="true">↑</span></button>
    </div>
    <div class="chat-copy" hidden>
      <p>滑动查看聊天记录，点按播放韩语语音</p>
      <button class="action" id="listen">听见身后有人 <span aria-hidden="true">↗</span></button>
    </div>
    <section class="ending" aria-label="转身后的夜景" hidden>
      <img class="far" src="media/IMG_8201(1).jpeg" alt="夜色广场里回头望来的成灿" draggable="false">
      <img class="near" src="media/IMG_8200(1).jpeg" alt="灯光下近处的成灿" draggable="false">
    </section>
    <div class="ending-copy" hidden>
      <div class="subtitle"><span lang="ko">저기요. 혹시 그거 제 휴대폰이에요?</span><span>打扰一下，那是我的手机吗？</span></div>
      <button class="action" id="turn" hidden>转身抬头 <span aria-hidden="true">↗</span></button>
      <button class="action" id="restart" hidden>从头再看 <span aria-hidden="true">↺</span></button>
    </div>
    <span id="announcement" class="sr-only" role="status"></span>
  </main>
</body>
</html>
