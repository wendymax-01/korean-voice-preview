<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5b5554">
  <title>捡到郑成灿手机</title>
  <meta name="description" content="一部亮着的手机，一条没来得及回的消息。第一人称互动手书。">
  <link rel="stylesheet" href="film.css?v=4">
  <script defer src="film.js"></script>
</head>
<body>
  <main class="film" id="film" data-scene="opening" aria-label="捡到郑成灿手机">
    <div class="street" aria-hidden="true"><div class="pavement"></div></div>
    <div class="title">
      <span lang="ko">밤에 주운 휴대폰</span>
      <h1>捡到郑成灿手机</h1>
    </div>
    <div class="prop">
      <div class="phone">
        <div class="lcd" lang="ko">
          <div class="status"><span>21:47</span><span class="island"></span><span class="signals" aria-label="5G, 배터리 78%"><i class="bars"></i> 5G <i class="battery"></i></span></div>
          <header class="chat-head">
            <span class="back-icon" aria-hidden="true"></span><strong>X</strong>
            <button id="search-toggle" class="icon-button" aria-label="대화 검색" aria-expanded="false" disabled><i class="search-icon"></i></button>
          </header>
          <form id="search" class="search" hidden>
            <input id="query" type="search" aria-label="대화 검색" placeholder="대화 내용 검색">
            <button type="submit">찾기</button>
            <output id="search-result" aria-live="polite"></output>
          </form>
          <div id="messages" class="messages" role="region" aria-label="X와의 대화" tabindex="-1"></div>
          <div class="composer"><span aria-hidden="true">＋</span><span>메시지 입력</span></div>
          <div class="home-line"></div>
        </div>
      </div>
      <svg class="grip palm" viewBox="0 0 420 520" preserveAspectRatio="none" aria-hidden="true">
        <g fill="#ddd0c5" stroke="#625a58" stroke-width="2.2" stroke-linejoin="round">
          <path d="M13 471C0 427 9 383 21 342C32 305 48 274 55 245L108 257L126 404C116 447 88 473 74 504Z"/>
          <path d="M348 131C370 124 389 131 394 147C402 170 384 187 360 195L345 188Z"/>
          <path d="M351 221C375 211 395 219 401 236C408 261 386 278 359 284L349 273Z"/>
          <path d="M350 306C373 296 392 302 397 319C404 340 385 359 359 365L350 355Z"/>
        </g>
        <path d="M375 147q9 4 11 13m-5 76q9 4 11 11m-15 70q9 4 12 12" fill="none" stroke="#ae9991" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="grip thumb" viewBox="0 0 420 520" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 448C8 415 16 387 23 354C29 329 31 308 33 282C35 259 32 236 35 213C38 191 48 176 58 178C68 179 71 192 69 205L65 237C64 250 69 264 67 277C66 289 59 300 53 313C47 331 50 351 45 375C41 398 35 418 27 440Z" fill="#e2d4c8" stroke="#665c58" stroke-width="2" stroke-linejoin="round"/>
        <path d="M40 208C43 187 51 179 57 181C63 182 65 191 63 202L60 214C54 217 46 214 40 208Z" fill="#eadcd2" stroke="#a79388" stroke-width="1.2"/>
        <path d="M40 249q8-5 17-3m-16 11q7-4 15-4" fill="none" stroke="#a39185" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M0 438Q29 399 67 416Q80 423 88 443Q102 471 116 520H0Z" fill="#b6afb0" stroke="#675e61" stroke-width="2.05" stroke-linejoin="round"/>
        <path d="M1 441Q30 409 63 422Q77 429 82 448M10 439l17 39m-5-50 16 40m-4-47 17 42m-2-44 17 40m-4-36 16 33" fill="none" stroke="#82777a" stroke-width="1.35" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="opening-copy">
      <p>路边，一部手机还亮着。</p>
      <button class="action" id="pickup">捡起手机 <span aria-hidden="true">↑</span></button>
    </div>
    <div class="chat-copy" hidden>
      <p>滑动查看聊天记录，点按播放韩语语音</p>
      <button class="action" id="listen">听见身后有人 <span aria-hidden="true">↗</span></button>
    </div>
    <section class="ending" aria-label="转身后的夜景" hidden>
      <img class="far" src="media/IMG_8201(1).jpeg" alt="夜色广场里回头望来的成灿" draggable="false">
      <img class="near" src="media/IMG_8200(1).jpeg" alt="灯光下近处的成灿" draggable="false">
    </section>
    <div class="ending-copy" hidden>
      <div class="subtitle"><span lang="ko">저기요. 혹시 그거 제 휴대폰이에요?</span><span>打扰一下，那是我的手机吗？</span></div>
      <button class="action" id="turn" hidden>转身抬头 <span aria-hidden="true">↗</span></button>
      <button class="action" id="restart" hidden>从头再看 <span aria-hidden="true">↺</span></button>
    </div>
    <span id="announcement" class="sr-only" role="status"></span>
  </main>
</body>
</html>
